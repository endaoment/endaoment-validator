name: Agent entry check

on:
  pull_request:

permissions:
  contents: read

jobs:
  agent-entry-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check agent entry files
        uses: endaoment/endaoment-toolbox/tools/agent-entry-check@main
